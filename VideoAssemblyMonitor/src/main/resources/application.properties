spring.application.name=demo

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB

spring.devtools.restart.enabled=false

# ?? Kubernetes ??????? Windows ?? Connection refused ????
management.health.probes.enabled=false
spring.datasource.url=jdbc:mysql://localhost:3306/oil_pump_assembly
spring.datasource.username=root
spring.datasource.password=seed
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.port=8000

# Optional configurations for better connection pooling (HikariCP, default)
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

spring.config.import=optional:configserver:

spring.datasource.hikari.leak-detection-threshold=30000
